# =====================================================================
# WebAgent · projeto Docker isolado na VPS
# Não altera o Bookweb nem a Evolution atual. Só o painel (webagent_web)
# entra na rede do Caddy existente (evolution-net), para ser publicado
# em https://webcashcompany.tech. Nenhuma porta é aberta na VPS.
# =====================================================================
name: webagent

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  webagent-web:
    image: ghcr.io/barreto0620/webagent-web:${WEBAGENT_TAG:-latest}
    container_name: webagent_web
    restart: unless-stopped
    environment:
      API_URL: http://webagent-api:3001
    depends_on:
      webagent-api: { condition: service_healthy }
    networks:
      - webagent
      - evolution-net
    mem_limit: 512m
    cpus: 0.75
    logging: *logging

  webagent-api:
    image: ghcr.io/barreto0620/webagent-api:${WEBAGENT_TAG:-latest}
    container_name: webagent_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      LOG_LEVEL: info
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      REDIS_URL: redis://webagent-redis:6379/0
      EVOLUTION_URL: http://webagent-evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      PUBLIC_WEBHOOK_BASE: http://webagent-api:3001
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      HEARTBEAT_INTERVAL_HOURS: ${HEARTBEAT_INTERVAL_HOURS:-24}
      SEND_MIN_INTERVAL_MS: ${SEND_MIN_INTERVAL_MS:-1200}
    depends_on:
      webagent-redis: { condition: service_healthy }
      webagent-evolution: { condition: service_started }
    networks: [webagent]
    mem_limit: 512m
    cpus: 0.75
    logging: *logging

  webagent-redis:
    image: redis:7-alpine
    container_name: webagent_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    volumes: [webagent_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [webagent]
    mem_limit: 256m
    logging: *logging

  # Segunda Evolution, exclusiva do WebAgent (a do Bookweb continua intacta)
  webagent-evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: webagent_evolution
    restart: unless-stopped
    depends_on:
      webagent-evolution-db: { condition: service_healthy }
      webagent-redis: { condition: service_healthy }
    volumes: [webagent_evolution_instances:/evolution/instances]
    environment:
      SERVER_NAME: webagent-evolution
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://webagent-evolution:8080
      TELEMETRY_ENABLED: "false"
      # Fica só na rede interna (sem porta publicada) e exige apikey.
      # A Evolution recusa chamadas servidor-a-servidor (sem Origin) se não for "*".
      CORS_ORIGIN: "*"
      CORS_METHODS: "GET,POST,PUT,DELETE"
      CORS_CREDENTIALS: "false"
      LOG_LEVEL: "ERROR,WARN,INFO"
      LOG_COLOR: "false"
      LOG_BAILEYS: error
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: WebAgent
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      WEBHOOK_GLOBAL_ENABLED: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@webagent-evolution-db:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: evolution_webagent
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://webagent-redis:6379/1
      CACHE_REDIS_PREFIX_KEY: webagent_evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
    networks: [webagent]
    mem_limit: 1g
    cpus: 1.0
    logging: *logging

  webagent-evolution-db:
    image: postgres:15-alpine
    container_name: webagent_evolution_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
    volumes: [webagent_evolution_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [webagent]
    mem_limit: 512m
    logging: *logging

volumes:
  webagent_redis:
  webagent_evolution_instances:
  webagent_evolution_db:

networks:
  webagent:
    name: webagent-net
    driver: bridge
  # Rede do Caddy existente (criada pelo projeto "evolution"). Só o painel entra nela.
  evolution-net:
    external: true
